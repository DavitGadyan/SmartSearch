[project]
name = "smartsearch-api"
version = "0.1.0"
description = "SmartSearch — Commerce Intelligence Engine: hybrid search, learning-to-rank, personalization, recommendations and an A/B experimentation engine for ecommerce."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "redis>=5.0",
  "pgvector>=0.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "bm25s>=0.2",
  "pystemmer>=2.2",
  "model2vec>=0.3",
  "duckdb>=1.1",
  "mlflow>=2.17,<3",
  "anthropic>=0.40",
  "httpx>=0.27",
  "orjson>=3.10",
  "mmh3>=4.1",
  "pyarrow>=17",
  "sse-starlette>=2.1",
  "tqdm>=4.66",
  "networkx>=3.3",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "kaggle>=1.6",
]

[tool.uv]
package = false
# cryptography >= 45 ships no macOS x86_64 wheel (needs a Rust toolchain to build); it's only a transitive dep of mlflow.
constraint-dependencies = ["cryptography<45"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
